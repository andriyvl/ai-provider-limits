<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: LiquidGlassTheme panelBackground (#1F2126) -->
    <linearGradient id="panelBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262930"/>
      <stop offset="100%" stop-color="#181A1E"/>
    </linearGradient>

    <!-- Dial Plate -->
    <linearGradient id="plateBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3138"/>
      <stop offset="100%" stop-color="#212428"/>
    </linearGradient>

    <!-- Needle Gradient (from Concept 1): Clean white to silver -->
    <linearGradient id="needleBlade4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7C7C7"/>
    </linearGradient>

    <filter id="crispShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#panelBg4)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Dial Plate -->
  <circle cx="256" cy="268" r="184" fill="url(#plateBg4)"/>

  <!-- Ring 1 (Outer - Green, Radius 146, Sweep 150° to 30°) -->
  <!-- Inactive Base -->
  <path d="M 129.5 341.0 A 146 146 0 1 1 382.5 341.0" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-opacity="0.08" 
        stroke-width="16" 
        stroke-linecap="round"/>
  <!-- Active Green Arc (Healthy ~80% remaining, 150° to 15°) -->
  <path d="M 129.5 341.0 A 146 146 0 1 1 397.0 230.2" 
        fill="none" 
        stroke="#52C785" 
        stroke-width="16" 
        stroke-linecap="round"/>

  <!-- Ring 2 (Middle - Orange, Radius 116, Sweep 150° to 30°) -->
  <!-- Inactive Base -->
  <path d="M 155.5 326.0 A 116 116 0 1 1 356.5 326.0" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-opacity="0.08" 
        stroke-width="16" 
        stroke-linecap="round"/>
  <!-- Active Orange Arc (Warning ~35% remaining, 150° to 255°) -->
  <path d="M 155.5 326.0 A 116 116 0 0 1 226.0 156.0" 
        fill="none" 
        stroke="#E0B352" 
        stroke-width="16" 
        stroke-linecap="round"/>

  <!-- Ring 3 (Inner - Red, Radius 86, Sweep 150° to 30°) -->
  <!-- Inactive Base -->
  <path d="M 181.5 311.0 A 86 86 0 1 1 330.5 311.0" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-opacity="0.08" 
        stroke-width="16" 
        stroke-linecap="round"/>
  <!-- Active Red Arc (Critical ~15% remaining, 150° to 195°) -->
  <path d="M 181.5 311.0 A 86 86 0 0 1 172.9 245.7" 
        fill="none" 
        stroke="#E06B6B" 
        stroke-width="16" 
        stroke-linecap="round"/>

  <!-- Pointer / Needle from Concept 1 (Solid tapered blade with green tip bead) -->
  <g filter="url(#crispShadow4)">
    <!-- Tapered Lever Hand sweeping to outer ring -->
    <path d="M 251 274 L 247 262 L 348 154 L 356 162 L 261 274 Z" 
          fill="url(#needleBlade4)"/>

    <!-- Green Status Indicator Dot on Needle Tip -->
    <circle cx="352" cy="158" r="4.5" fill="#52C785"/>
  </g>

  <!-- Central Knob / Hub from Concept 1 (Precision 3-tier instrument pivot) -->
  <circle cx="256" cy="268" r="24" fill="#1F2126" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="256" cy="268" r="14" fill="#383B40"/>
  <circle cx="256" cy="268" r="6" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
